name: ESP32 Arduino Libs CI

on:
  push:
    branches:
    - master
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!.github/workflows/cron_build.yml"
      - "!.github/workflows/cron.yml"
      - "!.github/workflows/docker.yml"
      - "!.github/workflows/repository_dispatch.yml"
      - "!tools/config_editor/**"
      - "!tools/docker/**"

concurrency:
  group: esp-idf-libs-${{github.event.pull_request.number || github.ref}}
  cancel-in-progress: true

jobs:
  build-libs:
    name: Build Libs for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # SlicklinePro fork: only the chip this project uses. Building the other
        # ten wastes an hour of CI and lets an unrelated target fail the run.
        target: [esp32s3]
      fail-fast: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install dependencies
      run: bash ./tools/prepare-ci.sh

    # SlicklinePro fork: GitHub requires a signed-in session to read workflow
    # logs, and the only thing an anonymous caller can see is "exit code 1".
    # Annotations ARE readable without signing in, so on failure the tail of the
    # build output is re-emitted as one, which is enough to work out what broke.
    - name: Build Libs for ${{ matrix.target }}
      run: |
        set +e
        bash ./build.sh -e -t ${{ matrix.target }} 2>&1 | tee /tmp/build.log
        rc=${PIPESTATUS[0]}
        if [ $rc -ne 0 ]; then
          # Annotations are capped in size, and a plain tail of this build is all
          # CMake configure chatter — the real message scrolls past. Pull the lines
          # that actually say something went wrong, wherever they are in the log.
          # -A 8: a CMake Error's first line names the file and macro, the reason
          # is in the indented lines under it. Grabbing only matching lines threw
          # the reason away.
          MSG=$(grep -aiE -A 8 '(^|[^a-z])(CMake Error|error:|fatal|FAILED|undefined reference|No such file)' /tmp/build.log \
                | grep -vaiE 'Deprecation Warning|CMP0|cmake_minimum_required|Compatibility with CMake' \
                | tail -40 | cut -c1-200 \
                | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          [ -z "$MSG" ] && MSG=$(tail -20 /tmp/build.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=build.sh exit $rc::${MSG}"
        fi
        exit $rc

    - name: Upload build
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: build-${{ matrix.target }}
        path: build

    - name: Upload archive
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: artifacts-${{ matrix.target }}
        path: dist

  combine-artifacts:
    name: Combine artifacts
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: dist
          pattern: artifacts-*
          merge-multiple: true

      - shell: bash
        run: |
          mkdir -p out
          find dist -name 'arduino-esp32-libs-esp*.tar.gz' -exec tar zxvf {} -C out \;
          cd out/tools/esp32-arduino-libs && tar zcf ../../../dist/esp32-arduino-libs.tar.gz * && cd ../../..
          cp out/package_esp32_index.template.json dist/package_esp32_index.template.json

      - name: Upload full esp32-arduino-libs archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esp32-arduino-libs
          path: dist/esp32-arduino-libs.tar.gz

      - name: Upload package_esp32_index.template.json
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-esp32-index-json
          path: dist/package_esp32_index.template.json

